<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CSS Position Demonstration</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 30px;
    }

    h3 {
      font-weight: normal;
      margin-bottom: 8px;
    }

    /* Outer container with dotted outline */
    .container {
      display: inline-flex;
      border: 2px dotted #000;
      margin-bottom: 70px;
      position: relative; /* Provides reference boundary for absolute child */
    }

    /* Common box styles */
    .box {
      width: 90px;
      height: 90px;
      padding: 4px;
      box-sizing: border-box;
      font-family: serif;
      font-size: 15px;
      color: #000;
      background-color: #ff081b; /* Red */
      margin-right: 2px;
    }

    .box:last-child {
      margin-right: 0;
    }

    /* Box Two: Target element */
    .two {
      background-color: #0b8017; /* Green */
    }

    /* 1. Static: normal flow */
    .static .two {
      position: static;
    }

    /* 2. Relative: shifts visually, preserves original flow space */
    .relative .two {
      position: relative;
      top: 20px;
      left: 20px;
    }

    /* 3. Absolute: pulled out of flow, surrounding boxes collapse together */
    .absolute .two {
      position: absolute;
      top: 10px;
      left: 10px;
    }
  </style>
</head>
<body>

  <!-- Example 1: Static -->
  <h3>position: static</h3>
  <div class="container static">
    <div class="box">One</div>
    <div class="box two">Two</div>
    <div class="box">Three</div>
    <div class="box">Four</div>
  </div>

  <!-- Example 2: Relative -->
  <h3>position: relative</h3>
  <div class="container relative">
    <div class="box">One</div>
    <div class="box two">Two</div>
    <div class="box">Three</div>
    <div class="box">Four</div>
  </div>

  <!-- Example 3: Absolute -->
  <h3>position: absolute</h3>
  <div class="container absolute">
    <div class="box">One</div>
    <div class="box two">Two</div>
    <div class="box">Three</div>
    <div class="box">Four</div>
  </div>

</body>
</html>
